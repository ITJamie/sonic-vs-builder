name: Build SONiC images

on:
  workflow_dispatch:
    inputs:
      branches:
        description: Comma-separated upstream branches (also used as VS image tags)
        required: true
        default: '202605'
        type: string
      images:
        description: Images to build and attach to the release
        required: true
        default: all
        type: choice
        options:
          - all
          - vs
          - kvm
          - broadcom
          - both
      build_jobs:
        description: Parallel upstream build jobs per platform
        required: true
        default: '3'
        type: string
      enable_ztp:
        description: Include ZTP in KVM and hardware installers (upstream ENABLE_ZTP)
        required: true
        default: false
        type: boolean
      cache_mode:
        description: Reuse persistent downloads and dependency-checked packages
        required: true
        default: read-write
        type: choice
        options:
          - read-write
          - off
      publish_dockerhub:
        description: Also push the validated VS image to itjamie/docker-sonic-vs
        required: true
        default: true
        type: boolean
      docker_layer_cache:
        description: Reuse Docker layers when rebuilding containers (supported branches)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: sonic-vs-build-host
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      matrix: ${{ steps.identity.outputs.matrix }}
    steps:
      - name: Check Docker Hub secret configuration
        if: ${{ inputs.publish_dockerhub && (inputs.images == 'all' || inputs.images == 'both' || inputs.images == 'vs') }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo '::error::Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, or disable publish_dockerhub.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: matrix
        env:
          BRANCHES: ${{ inputs.branches }}
          BUILD_JOBS: ${{ inputs.build_jobs }}
          IMAGES: ${{ inputs.images }}
        run: |
          matrix=$(python3 scripts/sonic_vs.py prepare --branches "$BRANCHES" --build-jobs "$BUILD_JOBS" --images "$IMAGES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Anchor release tags and verify draft publication before long builds
        id: identity
        env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
          REPOSITORY: ${{ github.repository }}
          BUILDER_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_ZTP: ${{ inputs.enable_ztp }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from releases import api, reserve_build
          matrix = json.loads(os.environ["MATRIX"])
          # Use this pipeline attempt's start, not a later self-hosted job start.
          started_at = api(os.environ["REPOSITORY"],
                           f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/attempts/"
                           f"{os.environ['GITHUB_RUN_ATTEMPT']}")["run_started_at"]
          matrix["include"] = [reserve_build(
              os.environ["REPOSITORY"], entry, os.environ["BUILDER_COMMIT"],
              os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"],
              started_at, os.environ["ENABLE_ZTP"] == "true") for entry in matrix["include"]]
          # The public image version contains our Docker Hub username, which
          # GitHub masks as a secret and consequently suppresses the entire job
          # output. Reconstruct it in the build job from the allocated label.
          for entry in matrix["include"]:
              del entry["image_version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          PY

  build:
    name: Build ${{ matrix.branch }} (${{ matrix.build_label }})
    needs: prepare
    runs-on: [self-hosted, linux, x64, sonic-vs]
    timeout-minutes: 1440
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ matrix.release_tag }}
      BUILD_LABEL: ${{ matrix.build_label }}
      BUILD_STARTED_AT: ${{ matrix.build_started_at }}
      REPOSITORY: ${{ github.repository }}
      BUILDER_COMMIT: ${{ github.sha }}
      SONIC_CACHE_DIR: ${{ vars.SONIC_CACHE_DIR }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set native image version from reserved build label
        env:
          BRANCH: ${{ matrix.branch }}
          ENABLE_ZTP: ${{ inputs.enable_ztp }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          from sonic_vs import version_name
          version = version_name(os.environ["BRANCH"], os.environ["BUILD_LABEL"],
                                 os.environ["ENABLE_ZTP"] == "true")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"SONIC_IMAGE_VERSION={version}\n")
          PY
      - name: Create VS workspace
        if: ${{ contains(matrix.images, 'vs') }}
        id: vs_work
        run: echo "path=$(python3 scripts/sonic_vs.py create-work)" >> "$GITHUB_OUTPUT"
      - name: Docker storage before builds
        continue-on-error: true
        run: docker system df
      - name: Build and validate VS
        if: ${{ contains(matrix.images, 'vs') }}
        env:
          WORK: ${{ steps.vs_work.outputs.path }}
          BRANCH: ${{ matrix.branch }}
          COMMIT: ${{ matrix.commit }}
          BUILD_JOBS: ${{ inputs.build_jobs }}
          ENABLE_ZTP: ${{ inputs.enable_ztp }}
          CACHE_MODE: ${{ inputs.cache_mode }}
          DOCKER_LAYER_CACHE: ${{ inputs.docker_layer_cache }}
        run: |
          set -o pipefail
          python3 -u scripts/sonic_vs.py build --platform vs --work "$WORK" --branch "$BRANCH" --commit "$COMMIT" --build-jobs "$BUILD_JOBS" --cache-mode "$CACHE_MODE" --docker-layer-cache "$DOCKER_LAYER_CACHE" --enable-ztp "$ENABLE_ZTP" 2>&1 | tee "$WORK/build.log"
      - name: Publish validated VS image to selected registries
        if: ${{ contains(matrix.images, 'vs') }}
        env:
          WORK: ${{ steps.vs_work.outputs.path }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PUBLISH_DOCKERHUB: ${{ inputs.publish_dockerhub }}
        run: |
          set -o pipefail
          python3 -u scripts/sonic_vs.py publish --work "$WORK" --repository "$REPOSITORY" --dockerhub "$PUBLISH_DOCKERHUB" 2>&1 | tee "$WORK/publish.log"
      - name: Stage VS downloads in draft release
        if: ${{ contains(matrix.images, 'vs') }}
        env:
          WORK: ${{ steps.vs_work.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 -u scripts/releases.py stage --work "$WORK" --repository "$REPOSITORY" --tag "$RELEASE_TAG" --target "$BUILDER_COMMIT" 2>&1 | tee "$WORK/release.log"
      - name: Retain VS logs and metadata
        if: ${{ always() && steps.vs_work.outputs.path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonic-vs-${{ matrix.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.vs_work.outputs.path }}/*.log
            ${{ steps.vs_work.outputs.path }}/metadata.json
            ${{ steps.vs_work.outputs.path }}/validated.json
            ${{ steps.vs_work.outputs.path }}/release.json
            ${{ steps.vs_work.outputs.path }}/cache.json
            ${{ steps.vs_work.outputs.path }}/patches.json
            ${{ steps.vs_work.outputs.path }}/docker-cache.json
          retention-days: 14
          if-no-files-found: warn
      - name: Clean VS workspace before continuing
        if: ${{ always() && steps.vs_work.outputs.path != '' }}
        env:
          WORK: ${{ steps.vs_work.outputs.path }}
        run: python3 scripts/sonic_vs.py cleanup --work "$WORK"
      - name: Create KVM workspace
        if: ${{ contains(matrix.images, 'kvm') }}
        id: kvm_work
        run: echo "path=$(python3 scripts/sonic_vs.py create-work)" >> "$GITHUB_OUTPUT"
      - name: Build and validate KVM
        if: ${{ contains(matrix.images, 'kvm') }}
        env:
          WORK: ${{ steps.kvm_work.outputs.path }}
          BRANCH: ${{ matrix.branch }}
          COMMIT: ${{ matrix.commit }}
          BUILD_JOBS: ${{ inputs.build_jobs }}
          ENABLE_ZTP: ${{ inputs.enable_ztp }}
          CACHE_MODE: ${{ inputs.cache_mode }}
          DOCKER_LAYER_CACHE: ${{ inputs.docker_layer_cache }}
        run: |
          set -o pipefail
          python3 -u scripts/sonic_vs.py build --platform kvm --work "$WORK" --branch "$BRANCH" --commit "$COMMIT" --build-jobs "$BUILD_JOBS" --cache-mode "$CACHE_MODE" --docker-layer-cache "$DOCKER_LAYER_CACHE" --enable-ztp "$ENABLE_ZTP" 2>&1 | tee "$WORK/build.log"
      - name: Stage KVM downloads in draft release
        if: ${{ contains(matrix.images, 'kvm') }}
        env:
          WORK: ${{ steps.kvm_work.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 -u scripts/releases.py stage --work "$WORK" --repository "$REPOSITORY" --tag "$RELEASE_TAG" --target "$BUILDER_COMMIT" 2>&1 | tee "$WORK/release.log"
      - name: Retain KVM logs and metadata
        if: ${{ always() && steps.kvm_work.outputs.path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonic-kvm-${{ matrix.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.kvm_work.outputs.path }}/*.log
            ${{ steps.kvm_work.outputs.path }}/metadata.json
            ${{ steps.kvm_work.outputs.path }}/validated.json
            ${{ steps.kvm_work.outputs.path }}/release.json
            ${{ steps.kvm_work.outputs.path }}/cache.json
            ${{ steps.kvm_work.outputs.path }}/patches.json
            ${{ steps.kvm_work.outputs.path }}/docker-cache.json
          retention-days: 14
          if-no-files-found: warn
      - name: Clean KVM workspace before continuing
        if: ${{ always() && steps.kvm_work.outputs.path != '' }}
        env:
          WORK: ${{ steps.kvm_work.outputs.path }}
        run: python3 scripts/sonic_vs.py cleanup --work "$WORK"
      - name: Create Broadcom workspace
        if: ${{ contains(matrix.images, 'broadcom') }}
        id: broadcom_work
        run: echo "path=$(python3 scripts/sonic_vs.py create-work)" >> "$GITHUB_OUTPUT"
      - name: Build and validate Broadcom
        if: ${{ contains(matrix.images, 'broadcom') }}
        env:
          WORK: ${{ steps.broadcom_work.outputs.path }}
          BRANCH: ${{ matrix.branch }}
          COMMIT: ${{ matrix.commit }}
          BUILD_JOBS: ${{ inputs.build_jobs }}
          ENABLE_ZTP: ${{ inputs.enable_ztp }}
          CACHE_MODE: ${{ inputs.cache_mode }}
          DOCKER_LAYER_CACHE: ${{ inputs.docker_layer_cache }}
        run: |
          set -o pipefail
          python3 -u scripts/sonic_vs.py build --platform broadcom --work "$WORK" --branch "$BRANCH" --commit "$COMMIT" --build-jobs "$BUILD_JOBS" --cache-mode "$CACHE_MODE" --docker-layer-cache "$DOCKER_LAYER_CACHE" --enable-ztp "$ENABLE_ZTP" 2>&1 | tee "$WORK/build.log"
      - name: Stage Broadcom downloads in draft release
        if: ${{ contains(matrix.images, 'broadcom') }}
        env:
          WORK: ${{ steps.broadcom_work.outputs.path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 -u scripts/releases.py stage --work "$WORK" --repository "$REPOSITORY" --tag "$RELEASE_TAG" --target "$BUILDER_COMMIT" 2>&1 | tee "$WORK/release.log"
      - name: Retain Broadcom logs and metadata
        if: ${{ always() && steps.broadcom_work.outputs.path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonic-broadcom-${{ matrix.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.broadcom_work.outputs.path }}/*.log
            ${{ steps.broadcom_work.outputs.path }}/metadata.json
            ${{ steps.broadcom_work.outputs.path }}/validated.json
            ${{ steps.broadcom_work.outputs.path }}/release.json
            ${{ steps.broadcom_work.outputs.path }}/cache.json
            ${{ steps.broadcom_work.outputs.path }}/patches.json
            ${{ steps.broadcom_work.outputs.path }}/docker-cache.json
          retention-days: 14
          if-no-files-found: warn
      - name: Clean Broadcom workspace before continuing
        if: ${{ always() && steps.broadcom_work.outputs.path != '' }}
        env:
          WORK: ${{ steps.broadcom_work.outputs.path }}
        run: python3 scripts/sonic_vs.py cleanup --work "$WORK"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGES: ${{ inputs.images }}
        run: python3 scripts/releases.py finish --repository "$REPOSITORY" --tag "$RELEASE_TAG" --images "$IMAGES"
      - name: Docker storage after builds
        if: ${{ always() }}
        continue-on-error: true
        run: docker system df
