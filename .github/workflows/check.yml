name: Check builder

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Docker cache permissions and cleanup integration
        run: python3 tests/permissions_integration.py
      - name: Upstream download cache regression
        run: python3 tests/download_hook_integration.py
      - name: Cached cleanup and final image assembly regression
        run: python3 tests/rsync_cleanup_integration.py
      - name: Install workflow checker
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Workflow and embedded shell checks
        run: '"$RUNNER_TEMP/actionlint-bin/actionlint"'
