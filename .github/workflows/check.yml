name: Check builder

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Docker cache permissions and cleanup integration
        run: python3 tests/permissions_integration.py
      - name: Persistent local package cache integration
        run: python3 tests/local_cache_integration.py
      - name: Upstream download cache regression
        run: python3 tests/download_hook_integration.py
      - name: Cached cleanup and final image assembly regression
        run: python3 tests/rsync_cleanup_integration.py
      - name: Branch patches and upstream Python dependency regression
        run: python3 tests/branch_patches_integration.py
      - name: Docker layer cache reuse and invalidation
        run: python3 tests/docker_layer_cache_integration.py
      - name: VS runtime Debian and pip package ownership regression
        run: python3 tests/vs_pycparser_integration.py
      - name: Docker archive load identity and tag preservation
        run: python3 tests/docker_load_integration.py
      - name: Trixie build-container groff inputs regression
        run: python3 tests/groff_cleanup_integration.py
      - name: Runner maintenance retention and dry-run regression
        run: python3 tests/maintenance_integration.py
      - name: Install workflow checker
        env:
          GOBIN: ${{ runner.temp }}/actionlint-bin
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Workflow and embedded shell checks
        run: '"$RUNNER_TEMP/actionlint-bin/actionlint"'
